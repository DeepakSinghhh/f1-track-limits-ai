# Event Notes for one race weekend. Nothing in src/rules/ may hardcode any
# value from this file — circuit names, corner numbers, and thresholds live
# here only, and are loaded through src/config.py::load_event_config.
circuit: red_bull_ring
year: 2023

# Corners under active track-limits monitoring for this event, per the
# Race Director's Event Notes. A geometric excursion at any other corner
# produces no finding (Apex Assist plan, Section 1.2).
monitored_corners: [1, 3, 4, 6, 9, 10]

# Width of the white line itself. The decision surface is the OUTER edge
# of the white line (Section 1.1) — kept here so the boundary model can be
# built consistently with what stewards see on the broadcast overlay.
white_line_width_m: 0.10

# Minimum sustained duration for an excursion to count as a track-limits
# event rather than a measurement artefact (kerb strike, single-frame
# noise) — Section 5.4/5.6. A detection-methodology parameter, not a
# regulation or a circuit fact, kept here rather than hardcoded in
# src/rules/ or src/events/.
measurement:
  min_event_duration_s: 0.150

# Per-event escalation configuration (Section 1.3). Thresholds are event
# notes, not regulations, and vary weekend to weekend.
escalation:
  black_and_white_flag_at: 3
  first_penalty_at: 4
  first_penalty_seconds: 5
  second_penalty_at: 5
  second_penalty_seconds: 10

citations:
  core_rule: "F1SR Art. 33.3"
  guidelines: "FIA Driving Standards Guidelines v4.1"
